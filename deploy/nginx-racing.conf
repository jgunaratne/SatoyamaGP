# racing — Satoyama GP, served at https://racing.local
#
# Name-based virtual host. nginx routes by Host header, so this coexists with
# the other *.local vhosts on 80/443.
#
# Install: /etc/nginx/sites-available/racing -> symlink into sites-enabled/
#
# https is pinned because the Gamepad API is only exposed in secure contexts.

server {
    listen 80;
    listen [::]:80;
    server_name racing.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name racing.local;

    ssl_certificate     /etc/nginx/ssl/local.crt;
    ssl_certificate_key /etc/nginx/ssl/local.key;

    # The game is one ~640 kB JS bundle; gzip takes it to ~170 kB.
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Online races: the WebSocket relay in server.mjs. Needs the Upgrade headers, and a read timeout longer
    # than the relay's 25 s heartbeat so an idle lobby is not cut off.
    location = /ws {
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Port 3013 — see racing.service for the port map on this box.
    location / {
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
